<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Reactive Particle Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            cursor: none;
            color: white;
        }

        #canvas {
            display: block;
            background: radial-gradient(circle at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .controls h3 {
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
            font-size: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .audio-section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .audio-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .audio-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .theme-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .theme-btn.neon {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
        }

        .theme-btn.fire {
            background: linear-gradient(45deg, #ff4500, #ff8c00);
        }

        .theme-btn.ocean {
            background: linear-gradient(45deg, #006994, #4facfe);
        }

        .theme-btn.forest {
            background: linear-gradient(45deg, #11998e, #38ef7d);
        }

        .theme-btn.galaxy {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .theme-btn.sunset {
            background: linear-gradient(45deg, #ff9a56, #ffad56);
        }

        .theme-btn:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .theme-btn.active {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #ccc;
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #333, #666);
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }

        .visualizer-bars {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            height: 60px;
            align-items: end;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 15px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.3), transparent);
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6vw;
            font-weight: bold;
            pointer-events: none;
            z-index: -1;
            text-align: center;
            background: linear-gradient(45deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: block;
            padding: 10px;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(78, 205, 196, 0.3);
        }
    </style>
</head>
<body>
    <div class="title">AUDIO<br>VISUALIZER</div>
    <div class="custom-cursor"></div>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h3>🎵 Audio Visualizer</h3>
        
        <div class="audio-section">
            <div class="audio-controls">
                <button class="audio-btn" id="micBtn">🎤 Microphone</button>
                <button class="audio-btn" id="demoBtn">🎵 Demo</button>
            </div>
            
            <label for="audioFile" class="file-label">📁 Upload Audio File</label>
            <input type="file" id="audioFile" class="file-input" accept="audio/*">
            
            <audio id="audioElement" controls style="width: 100%; margin-top: 10px; display: none;"></audio>
        </div>
        
        <div class="control-group">
            <label>Theme</label>
            <div class="theme-buttons">
                <button class="theme-btn neon active" data-theme="neon">Neon</button>
                <button class="theme-btn fire" data-theme="fire">Fire</button>
                <button class="theme-btn ocean" data-theme="ocean">Ocean</button>
                <button class="theme-btn forest" data-theme="forest">Forest</button>
                <button class="theme-btn galaxy" data-theme="galaxy">Galaxy</button>
                <button class="theme-btn sunset" data-theme="sunset">Sunset</button>
            </div>
        </div>
        
        <div class="control-group">
            <label>Sensitivity: <span id="sensitivityValue">100</span></label>
            <input type="range" id="sensitivity" min="50" max="300" value="100">
        </div>
        
        <div class="control-group">
            <label>Particle Count: <span id="countValue">200</span></label>
            <input type="range" id="particleCount" min="100" max="800" value="200">
        </div>
        
        <div class="control-group">
            <label>Reactivity: <span id="reactivityValue">5</span></label>
            <input type="range" id="reactivity" min="1" max="10" value="5">
        </div>
    </div>
    
    <div class="visualizer-bars" id="visualizerBars"></div>
    
    <div class="stats">
        <div>FPS: <span id="fps">60</span></div>
        <div>Audio: <span id="audioStatus">Inactive</span></div>
        <div>Theme: <span id="currentTheme">Neon</span></div>
        <div>Frequency: <span id="frequency">0 Hz</span></div>
    </div>

    <script>
        class AudioVisualizer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: 0, y: 0 };
                
                // Audio setup
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.source = null;
                this.isAudioActive = false;
                
                // Settings
                this.settings = {
                    count: 200,
                    sensitivity: 100,
                    reactivity: 5,
                    theme: 'neon'
                };
                
                // Themes
                this.themes = {
                    neon: ['#ff00ff', '#00ffff', '#ff0080', '#0080ff', '#80ff00'],
                    fire: ['#ff4500', '#ff8c00', '#ffd700', '#ff6347', '#dc143c'],
                    ocean: ['#006994', '#4facfe', '#00c9ff', '#92fe9d', '#1e3c72'],
                    forest: ['#11998e', '#38ef7d', '#56ab2f', '#a8e6cf', '#2d5016'],
                    galaxy: ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe'],
                    sunset: ['#ff9a56', '#ffad56', '#ff6b6b', '#feca57', '#ff9ff3']
                };
                
                this.frameCount = 0;
                this.lastTime = 0;
                this.fps = 60;
                
                this.init();
                this.bindEvents();
                this.animate();
                this.createVisualizerBars();
            }
            
            init() {
                this.resize();
                this.createParticles();
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createParticles() {
                this.particles = [];
                const colors = this.themes[this.settings.theme];
                
                for (let i = 0; i < this.settings.count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        opacity: Math.random() * 0.8 + 0.2,
                        life: Math.random() * Math.PI * 2,
                        baseSize: Math.random() * 3 + 1,
                        frequency: Math.random() * 255
                    });
                }
            }
            
            async setupAudio(type) {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 512;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    if (type === 'microphone') {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.source = this.audioContext.createMediaStreamSource(stream);
                    } else if (type === 'file') {
                        const audioElement = document.getElementById('audioElement');
                        this.source = this.audioContext.createMediaElementSource(audioElement);
                        this.source.connect(this.audioContext.destination);
                    } else if (type === 'demo') {
                        // Create demo audio with oscillators
                        this.createDemoAudio();
                        return;
                    }
                    
                    this.source.connect(this.analyser);
                    this.isAudioActive = true;
                    document.getElementById('audioStatus').textContent = 'Active';
                    
                } catch (error) {
                    console.error('Audio setup failed:', error);
                    document.getElementById('audioStatus').textContent = 'Failed';
                }
            }
            
            createDemoAudio() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 512;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                // Create multiple oscillators for rich demo sound
                const oscillators = [];
                const frequencies = [220, 330, 440, 550];
                
                frequencies.forEach((freq, index) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    
                    osc.type = ['sine', 'square', 'sawtooth', 'triangle'][index % 4];
                    osc.frequency.setValueAtTime(freq, this.audioContext.currentTime);
                    
                    // Modulate frequency for dynamic effect
                    const lfo = this.audioContext.createOscillator();
                    const lfoGain = this.audioContext.createGain();
                    lfo.frequency.setValueAtTime(0.5 + index * 0.2, this.audioContext.currentTime);
                    lfoGain.gain.setValueAtTime(freq * 0.1, this.audioContext.currentTime);
                    
                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    lfo.start();
                    
                    gain.gain.setValueAtTime(0.1, this.audioContext.currentTime);
                    
                    osc.connect(gain);
                    gain.connect(this.analyser);
                    gain.connect(this.audioContext.destination);
                    
                    osc.start();
                    oscillators.push({ osc, gain, lfo });
                });
                
                this.isAudioActive = true;
                document.getElementById('audioStatus').textContent = 'Demo Active';
            }
            
            getAudioData() {
                if (!this.analyser || !this.dataArray) return { average: 0, peak: 0, bass: 0, mid: 0, treble: 0 };
                
                this.analyser.getByteFrequencyData(this.dataArray);
                
                let sum = 0;
                let peak = 0;
                const length = this.dataArray.length;
                
                // Calculate different frequency ranges
                const bassEnd = Math.floor(length * 0.1);
                const midEnd = Math.floor(length * 0.5);
                
                let bass = 0, mid = 0, treble = 0;
                
                for (let i = 0; i < length; i++) {
                    const value = this.dataArray[i];
                    sum += value;
                    peak = Math.max(peak, value);
                    
                    if (i < bassEnd) bass += value;
                    else if (i < midEnd) mid += value;
                    else treble += value;
                }
                
                return {
                    average: sum / length,
                    peak: peak,
                    bass: bass / bassEnd,
                    mid: mid / (midEnd - bassEnd),
                    treble: treble / (length - midEnd)
                };
            }
            
            updateParticles(audioData) {
                const colors = this.themes[this.settings.theme];
                
                this.particles.forEach((particle, index) => {
                    // Audio-reactive size and movement
                    const frequencyIndex = Math.floor((index / this.particles.length) * this.dataArray.length);
                    const frequencyValue = this.dataArray ? this.dataArray[frequencyIndex] || 0 : 0;
                    
                    const reactivity = this.settings.reactivity * 0.1;
                    const sizeMultiplier = 1 + (frequencyValue / 255) * reactivity;
                    particle.size = particle.baseSize * sizeMultiplier;
                    
                    // Audio-reactive movement
                    const audioForce = (audioData.average / 255) * this.settings.sensitivity * 0.01;
                    particle.vx += (Math.random() - 0.5) * audioForce;
                    particle.vy += (Math.random() - 0.5) * audioForce;
                    
                    // Bass-reactive pulsing
                    particle.life += 0.05 + (audioData.bass / 255) * 0.1;
                    particle.opacity = 0.3 + Math.sin(particle.life) * 0.4 + (audioData.peak / 255) * 0.3;
                    
                    // Frequency-based color shifting
                    if (frequencyValue > 100) {
                        const colorIndex = Math.floor((frequencyValue / 255) * colors.length);
                        particle.color = colors[colorIndex % colors.length];
                    }
                    
                    // Apply movement
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    // Friction
                    particle.vx *= 0.98;
                    particle.vy *= 0.98;
                    
                    // Boundary wrapping
                    if (particle.x < 0) particle.x = this.canvas.width;
                    if (particle.x > this.canvas.width) particle.x = 0;
                    if (particle.y < 0) particle.y = this.canvas.height;
                    if (particle.y > this.canvas.height) particle.y = 0;
                });
            }
            
            drawParticles() {
                this.particles.forEach(particle => {
                    this.ctx.save();
                    this.ctx.globalAlpha = particle.opacity;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = particle.color;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    this.ctx.restore();
                });
            }
            
            drawWaveform(audioData) {
                if (!this.dataArray) return;
                
                this.ctx.save();
                this.ctx.strokeStyle = `rgba(255, 255, 255, 0.3)`;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                
                const sliceWidth = this.canvas.width / this.dataArray.length;
                let x = 0;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const v = this.dataArray[i] / 128.0;
                    const y = v * this.canvas.height / 4 + this.canvas.height / 2;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
                this.ctx.restore();
            }
            
            createVisualizerBars() {
                const barsContainer = document.getElementById('visualizerBars');
                for (let i = 0; i < 64; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.height = '2px';
                    barsContainer.appendChild(bar);
                }
            }
            
            updateVisualizerBars() {
                if (!this.dataArray) return;
                
                const bars = document.querySelectorAll('.bar');
                const step = Math.floor(this.dataArray.length / bars.length);
                
                bars.forEach((bar, index) => {
                    const value = this.dataArray[index * step] || 0;
                    const height = Math.max(2, (value / 255) * 60);
                    bar.style.height = height + 'px';
                });
            }
            
            animate(currentTime = 0) {
                // Calculate FPS
                if (currentTime - this.lastTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (currentTime - this.lastTime));
                    document.getElementById('fps').textContent = this.fps;
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                }
                this.frameCount++;
                
                // Get audio data
                const audioData = this.getAudioData();
                
                // Update frequency display
                document.getElementById('frequency').textContent = Math.round(audioData.peak) + ' Hz';
                
                // Clear canvas
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Update and draw particles
                this.updateParticles(audioData);
                this.drawParticles();
                
                // Draw waveform
                this.drawWaveform(audioData);
                
                // Update visualizer bars
                this.updateVisualizerBars();
                
                requestAnimationFrame((time) => this.animate(time));
            }
            
            bindEvents() {
                // Mouse events
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                    
                    const cursor = document.querySelector('.custom-cursor');
                    cursor.style.left = e.clientX - 15 + 'px';
                    cursor.style.top = e.clientY - 15 + 'px';
                });
                
                // Resize
                window.addEventListener('resize', () => this.resize());
                
                // Audio controls
                document.getElementById('micBtn').addEventListener('click', () => {
                    this.setupAudio('microphone');
                    document.querySelectorAll('.audio-btn').forEach(btn => btn.classList.remove('active'));
                    document.getElementById('micBtn').classList.add('active');
                });
                
                document.getElementById('demoBtn').addEventListener('click', () => {
                    this.setupAudio('demo');
                    document.querySelectorAll('.audio-btn').forEach(btn => btn.classList.remove('active'));
                    document.getElementById('demoBtn').classList.add('active');
                });
                
                document.getElementById('audioFile').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const audioElement = document.getElementById('audioElement');
                        audioElement.src = URL.createObjectURL(file);
                        audioElement.style.display = 'block';
                        audioElement.play();
                        this.setupAudio('file');
                    }
                });
                
                // Theme buttons
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelector('.theme-btn.active').classList.remove('active');
                        btn.classList.add('active');
                        this.settings.theme = btn.dataset.theme;
                        document.getElementById('currentTheme').textContent = btn.textContent;
                        this.createParticles();
                    });
                });
                
                // Controls
                document.getElementById('sensitivity').addEventListener('input', (e) => {
                    this.settings.sensitivity = parseInt(e.target.value);
                    document.getElementById('sensitivityValue').textContent = this.settings.sensitivity;
                });
                
                document.getElementById('particleCount').addEventListener('input', (e) => {
                    this.settings.count = parseInt(e.target.value);
                    document.getElementById('countValue').textContent = this.settings.count;
                    this.createParticles();
                });
                
                document.getElementById('reactivity').addEventListener('input', (e) => {
                    this.settings.reactivity = parseInt(e.target.value);
                    document.getElementById('reactivityValue').textContent = this.settings.reactivity;
                });
            }
        }
        
        // Initialize the visualizer
        window.addEventListener('load', () => {
            new AudioVisualizer();
        });
    </script>
</body>
</html>
