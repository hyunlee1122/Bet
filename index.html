<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Physics Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Particle Physics Playground</h1>
            <p>Interactive particle simulation with real-time physics</p>
        </header>
        
        <div class="main-content">
            <canvas id="canvas"></canvas>
            
            <div class="control-panel">
                <div class="control-group">
                    <h3>🎯 Particle Properties</h3>
                    <div class="control">
                        <label for="particleCount">Count: <span id="particleCountValue">100</span></label>
                        <input type="range" id="particleCount" min="10" max="500" value="100">
                    </div>
                    <div class="control">
                        <label for="particleSize">Size: <span id="particleSizeValue">3</span></label>
                        <input type="range" id="particleSize" min="1" max="10" value="3">
                    </div>
                    <div class="control">
                        <label for="particleSpeed">Speed: <span id="particleSpeedValue">2</span></label>
                        <input type="range" id="particleSpeed" min="0.1" max="5" step="0.1" value="2">
                    </div>
                </div>

                <div class="control-group">
                    <h3>⚡ Physics Forces</h3>
                    <div class="control">
                        <label for="gravity">Gravity: <span id="gravityValue">0.1</span></label>
                        <input type="range" id="gravity" min="0" max="1" step="0.01" value="0.1">
                    </div>
                    <div class="control">
                        <label for="friction">Friction: <span id="frictionValue">0.99</span></label>
                        <input type="range" id="friction" min="0.9" max="1" step="0.001" value="0.99">
                    </div>
                    <div class="control">
                        <label for="attraction">Mouse Force: <span id="attractionValue">0.5</span></label>
                        <input type="range" id="attraction" min="0" max="2" step="0.1" value="0.5">
                    </div>
                </div>

                <div class="control-group">
                    <h3>🎨 Visual Effects</h3>
                    <div class="control">
                        <label for="trails">Trails: <span id="trailsValue">0.1</span></label>
                        <input type="range" id="trails" min="0" max="1" step="0.01" value="0.1">
                    </div>
                    <div class="control checkbox-control">
                        <input type="checkbox" id="colorMode" checked>
                        <label for="colorMode">Rainbow Mode</label>
                    </div>
                    <div class="control checkbox-control">
                        <input type="checkbox" id="connections">
                        <label for="connections">Show Connections</label>
                    </div>
                </div>

                <div class="control-group">
                    <h3>🎮 Presets</h3>
                    <button class="preset-btn" data-preset="galaxy">🌌 Galaxy</button>
                    <button class="preset-btn" data-preset="fireworks">🎆 Fireworks</button>
                    <button class="preset-btn" data-preset="plasma">⚡ Plasma</button>
                    <button class="preset-btn" data-preset="snow">❄️ Snow</button>
                </div>

                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">FPS:</span>
                        <span id="fps">60</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Particles:</span>
                        <span id="activeParticles">100</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
