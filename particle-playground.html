<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Playground - Interactive Visual Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            cursor: none;
        }

        #canvas {
            display: block;
            background: transparent;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 20px;
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            max-width: 300px;
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #fff;
            text-align: center;
            font-size: 18px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .mode-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background: rgba(102, 126, 234, 0.3);
            color: white;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .mode-btn:hover {
            background: rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: #667eea;
            border-color: #fff;
        }

        .stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.1);
            font-size: 8vw;
            font-weight: bold;
            pointer-events: none;
            z-index: -1;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="title">PARTICLE<br>PLAYGROUND</div>
    <div class="custom-cursor"></div>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h3>🎮 Controls</h3>
        
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="attract">Attract</button>
            <button class="mode-btn" data-mode="repel">Repel</button>
            <button class="mode-btn" data-mode="orbit">Orbit</button>
            <button class="mode-btn" data-mode="flow">Flow</button>
            <button class="mode-btn" data-mode="explosion">Explode</button>
            <button class="mode-btn" data-mode="galaxy">Galaxy</button>
        </div>
        
        <div class="control-group">
            <label>Particle Count: <span id="countValue">150</span></label>
            <input type="range" id="particleCount" min="50" max="500" value="150">
        </div>
        
        <div class="control-group">
            <label>Speed: <span id="speedValue">1.0</span></label>
            <input type="range" id="speed" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        
        <div class="control-group">
            <label>Size: <span id="sizeValue">2</span></label>
            <input type="range" id="particleSize" min="1" max="8" value="2">
        </div>
        
        <div class="control-group">
            <label>Trail Length: <span id="trailValue">0.1</span></label>
            <input type="range" id="trailLength" min="0.01" max="0.5" step="0.01" value="0.1">
        </div>
        
        <div class="control-group">
            <label>Mouse Force: <span id="forceValue">50</span></label>
            <input type="range" id="mouseForce" min="10" max="200" value="50">
        </div>
    </div>
    
    <div class="stats">
        <div>FPS: <span id="fps">60</span></div>
        <div>Mode: <span id="currentMode">Attract</span></div>
        <div>Particles: <span id="particleCounter">150</span></div>
    </div>

    <script>
        class ParticlePlayground {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: 0, y: 0, isDown: false };
                this.mode = 'attract';
                this.settings = {
                    count: 150,
                    speed: 1.0,
                    size: 2,
                    trailLength: 0.1,
                    mouseForce: 50
                };
                
                this.colors = [
                    '#667eea', '#764ba2', '#f093fb', '#f5576c',
                    '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                    '#ffecd2', '#fcb69f', '#a8edea', '#fed6e3'
                ];
                
                this.frameCount = 0;
                this.lastTime = 0;
                this.fps = 60;
                
                this.init();
                this.bindEvents();
                this.animate();
            }
            
            init() {
                this.resize();
                this.createParticles();
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.settings.count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        originalX: Math.random() * this.canvas.width,
                        originalY: Math.random() * this.canvas.height,
                        color: this.colors[Math.floor(Math.random() * this.colors.length)],
                        size: Math.random() * this.settings.size + 1,
                        opacity: Math.random() * 0.8 + 0.2,
                        angle: Math.random() * Math.PI * 2,
                        life: Math.random()
                    });
                }
            }
            
            updateParticle(particle) {
                const dx = this.mouse.x - particle.x;
                const dy = this.mouse.y - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const maxDistance = 200;
                
                switch (this.mode) {
                    case 'attract':
                        if (distance < maxDistance) {
                            const force = (maxDistance - distance) / maxDistance * this.settings.mouseForce * 0.01;
                            particle.vx += dx * force * 0.01;
                            particle.vy += dy * force * 0.01;
                        }
                        break;
                        
                    case 'repel':
                        if (distance < maxDistance) {
                            const force = (maxDistance - distance) / maxDistance * this.settings.mouseForce * 0.01;
                            particle.vx -= dx * force * 0.01;
                            particle.vy -= dy * force * 0.01;
                        }
                        break;
                        
                    case 'orbit':
                        if (distance < maxDistance && distance > 10) {
                            const angle = Math.atan2(dy, dx);
                            const orbitalForce = this.settings.mouseForce * 0.0001;
                            particle.vx += Math.cos(angle + Math.PI/2) * orbitalForce;
                            particle.vy += Math.sin(angle + Math.PI/2) * orbitalForce;
                        }
                        break;
                        
                    case 'flow':
                        const flowX = Math.sin(particle.y * 0.01 + this.frameCount * 0.02) * 0.5;
                        const flowY = Math.cos(particle.x * 0.01 + this.frameCount * 0.02) * 0.5;
                        particle.vx += flowX * this.settings.speed * 0.1;
                        particle.vy += flowY * this.settings.speed * 0.1;
                        break;
                        
                    case 'explosion':
                        if (distance < 100) {
                            const explosionForce = (100 - distance) / 100 * this.settings.mouseForce * 0.02;
                            particle.vx += (particle.x - this.mouse.x) * explosionForce * 0.01;
                            particle.vy += (particle.y - this.mouse.y) * explosionForce * 0.01;
                        }
                        break;
                        
                    case 'galaxy':
                        const centerX = this.canvas.width / 2;
                        const centerY = this.canvas.height / 2;
                        const centerDx = centerX - particle.x;
                        const centerDy = centerY - particle.y;
                        const centerDistance = Math.sqrt(centerDx * centerDx + centerDy * centerDy);
                        
                        if (centerDistance > 10) {
                            const angle = Math.atan2(centerDy, centerDx);
                            const spiralForce = this.settings.mouseForce * 0.00005;
                            particle.vx += Math.cos(angle + Math.PI/2) * spiralForce;
                            particle.vy += Math.sin(angle + Math.PI/2) * spiralForce;
                            particle.vx += centerDx * spiralForce * 0.1;
                            particle.vy += centerDy * spiralForce * 0.1;
                        }
                        break;
                }
                
                // Apply velocity with speed multiplier
                particle.x += particle.vx * this.settings.speed;
                particle.y += particle.vy * this.settings.speed;
                
                // Apply friction
                particle.vx *= 0.98;
                particle.vy *= 0.98;
                
                // Bounce off edges
                if (particle.x < 0 || particle.x > this.canvas.width) {
                    particle.vx *= -0.8;
                    particle.x = Math.max(0, Math.min(this.canvas.width, particle.x));
                }
                if (particle.y < 0 || particle.y > this.canvas.height) {
                    particle.vy *= -0.8;
                    particle.y = Math.max(0, Math.min(this.canvas.height, particle.y));
                }
                
                // Update life for pulsing effect
                particle.life += 0.02;
                particle.opacity = 0.3 + Math.sin(particle.life) * 0.3;
            }
            
            drawParticle(particle) {
                this.ctx.save();
                this.ctx.globalAlpha = particle.opacity;
                this.ctx.fillStyle = particle.color;
                this.ctx.shadowBlur = 10;
                this.ctx.shadowColor = particle.color;
                
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.restore();
            }
            
            drawConnections() {
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 0.5;
                
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            const opacity = (100 - distance) / 100 * 0.2;
                            this.ctx.globalAlpha = opacity;
                            this.ctx.beginPath();
                            this.ctx.moveTo(this.particles[i].x, this.particles[i].y);
                            this.ctx.lineTo(this.particles[j].x, this.particles[j].y);
                            this.ctx.stroke();
                        }
                    }
                }
                
                this.ctx.restore();
            }
            
            animate(currentTime = 0) {
                // Calculate FPS
                if (currentTime - this.lastTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (currentTime - this.lastTime));
                    document.getElementById('fps').textContent = this.fps;
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                }
                this.frameCount++;
                
                // Clear canvas with trail effect
                this.ctx.fillStyle = `rgba(0, 0, 0, ${this.settings.trailLength})`;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Update and draw particles
                this.particles.forEach(particle => {
                    this.updateParticle(particle);
                    this.drawParticle(particle);
                });
                
                // Draw connections in some modes
                if (['attract', 'galaxy'].includes(this.mode)) {
                    this.drawConnections();
                }
                
                requestAnimationFrame((time) => this.animate(time));
            }
            
            bindEvents() {
                // Mouse events
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                    
                    // Update custom cursor
                    const cursor = document.querySelector('.custom-cursor');
                    cursor.style.left = e.clientX - 10 + 'px';
                    cursor.style.top = e.clientY - 10 + 'px';
                });
                
                window.addEventListener('mousedown', () => this.mouse.isDown = true);
                window.addEventListener('mouseup', () => this.mouse.isDown = false);
                
                // Resize
                window.addEventListener('resize', () => this.resize());
                
                // Mode buttons
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelector('.mode-btn.active').classList.remove('active');
                        btn.classList.add('active');
                        this.mode = btn.dataset.mode;
                        document.getElementById('currentMode').textContent = btn.textContent;
                    });
                });
                
                // Controls
                document.getElementById('particleCount').addEventListener('input', (e) => {
                    this.settings.count = parseInt(e.target.value);
                    document.getElementById('countValue').textContent = this.settings.count;
                    document.getElementById('particleCounter').textContent = this.settings.count;
                    this.createParticles();
                });
                
                document.getElementById('speed').addEventListener('input', (e) => {
                    this.settings.speed = parseFloat(e.target.value);
                    document.getElementById('speedValue').textContent = this.settings.speed;
                });
                
                document.getElementById('particleSize').addEventListener('input', (e) => {
                    this.settings.size = parseInt(e.target.value);
                    document.getElementById('sizeValue').textContent = this.settings.size;
                });
                
                document.getElementById('trailLength').addEventListener('input', (e) => {
                    this.settings.trailLength = parseFloat(e.target.value);
                    document.getElementById('trailValue').textContent = this.settings.trailLength;
                });
                
                document.getElementById('mouseForce').addEventListener('input', (e) => {
                    this.settings.mouseForce = parseInt(e.target.value);
                    document.getElementById('forceValue').textContent = this.settings.mouseForce;
                });
                
                // Keyboard shortcuts
                window.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case '1': this.switchMode('attract'); break;
                        case '2': this.switchMode('repel'); break;
                        case '3': this.switchMode('orbit'); break;
                        case '4': this.switchMode('flow'); break;
                        case '5': this.switchMode('explosion'); break;
                        case '6': this.switchMode('galaxy'); break;
                        case ' ': this.createParticles(); e.preventDefault(); break;
                    }
                });
            }
            
            switchMode(mode) {
                document.querySelector('.mode-btn.active').classList.remove('active');
                document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
                this.mode = mode;
                document.getElementById('currentMode').textContent = 
                    document.querySelector(`[data-mode="${mode}"]`).textContent;
            }
        }
        
        // Initialize the playground
        window.addEventListener('load', () => {
            new ParticlePlayground();
        });
    </script>
</body>
</html>
